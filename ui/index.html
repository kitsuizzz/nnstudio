<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nnstudio — a dedicated app for training a neural network</title>
<style>
  :root {
    --bg: #141414;                          /* neutral dark grey */
    --panel: rgba(255,255,255,.05);
    --panel-brd: rgba(255,255,255,.12);
    --ink: #f2f2f2;                         /* white */
    --ink-dim: #a3a3a3;                     /* grey */
    --ink-faint: #8a8a8a;
    --accent: #f97316;                      /* orange */
    --accent2: #e5e5e5;                     /* white-grey for data ink */
    --warm: #fbbf24;                        /* amber, warnings only */
    --blue: #e5e5e5;
    --err: #f87171;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(249,115,22,.11), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(255,255,255,.045), transparent 55%),
      radial-gradient(1000px 700px at 50% 120%, rgba(255,255,255,.025), transparent 60%),
      var(--bg);
    min-height: 100%;
  }
  header {
    max-width: 1180px; margin: 0 auto; padding: 34px 20px 10px;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  .logo { font-weight: 700; font-size: 26px; letter-spacing: -.02em; }
  .logo span { color: var(--accent); }
  .modes { display: flex; gap: 6px; }
  .mode {
    cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-dim);
    border: 1px solid var(--panel-brd); background: rgba(0,0,0,.25);
    padding: 6px 14px; border-radius: 999px; user-select: none; transition: all .15s;
  }
  .mode:hover { color: var(--ink); border-color: rgba(249,115,22,.55); }
  .mode.act { color: var(--ink); border-color: rgba(249,115,22,.7); background: rgba(249,115,22,.16); }
  .sub { color: var(--ink-dim); font-size: 13.5px; }
  main { max-width: 1180px; margin: 0 auto; padding: 14px 20px 60px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-brd);
    border-radius: 18px;
    padding: 20px 22px;
    margin-bottom: 18px;
    backdrop-filter: blur(14px);
    box-shadow: 0 18px 50px -30px rgba(0,0,0,.8);
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1.35fr; gap: 22px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  .gorow { display: flex; align-items: flex-start; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  button.go { flex: 0 0 auto; }
  /* the run-until picker beside the button: type to search, then click a
     result (text + #id) — the run only ever stops at a picked token */
  .untilcombo { position: relative; flex: 1 1 210px; min-width: 185px; }
  .untilcombo input { padding-right: 62px; }
  .untilcombo .uid {
    position: absolute; right: 32px; top: 50%; transform: translateY(-50%);
    font-family: var(--mono); font-size: 11px; color: var(--ink-faint); pointer-events: none;
  }
  .untilcombo .uclear {
    position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    cursor: pointer; color: var(--ink-dim); font-size: 15px; line-height: 1; padding: 2px 3px;
  }
  .untilcombo .uclear:hover { color: var(--ink); }
  #untilresults, #choiceresults {
    position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); z-index: 40;
    display: flex; flex-direction: column; gap: 4px; max-height: 240px; overflow: auto;
    background: #1c1c1c; border: 1px solid var(--panel-brd); border-radius: 12px; padding: 6px;
    box-shadow: 0 18px 50px -18px rgba(0,0,0,.9);
  }
  #untilresults[hidden], #choiceresults[hidden] { display: none; }
  #untilresults .tok, #choiceresults .tok {
    cursor: pointer; text-align: left;
    display: flex; align-items: baseline; gap: 8px;
    border: 1px solid var(--panel-brd); background: rgba(0,0,0,.25);
    border-radius: 10px; padding: 6px 10px;
    color: var(--ink-dim); transition: all .15s;
  }
  #untilresults .tok:hover, #choiceresults .tok:hover { color: var(--ink); border-color: rgba(249,115,22,.55); background: rgba(249,115,22,.12); }
  #untilresults .tok code, #choiceresults .tok code { font-family: var(--mono); font-size: 12px; word-break: break-all; white-space: pre-wrap; }
  #untilresults .tok .panehint, #choiceresults .tok .panehint { margin-left: auto; }
  /* sections, tasks & inference */
  .sec {
    display: flex; align-items: center; gap: 8px; margin: 0 0 10px;
    font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-dim);
  }
  .sec .secnum {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 50%; letter-spacing: 0;
    background: rgba(249,115,22,.18); border: 1px solid rgba(249,115,22,.45);
    color: var(--ink); font-size: 11px;
  }
  button.btn {
    cursor: pointer; border: 1px solid rgba(249,115,22,.5); border-radius: 11px;
    padding: 8px 15px; font: 600 13px system-ui; color: var(--ink);
    background: rgba(249,115,22,.18); transition: all .15s;
  }
  button.btn:hover { background: rgba(249,115,22,.3); border-color: rgba(249,115,22,.75); transform: translateY(-1px); }
  button.btn:disabled { opacity: .5; cursor: wait; transform: none; }
  :focus-visible { outline: 2px solid rgba(249,115,22,.7); outline-offset: 2px; }
  .taskbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    border: 1px solid var(--panel-brd); background: rgba(0,0,0,.22);
    border-radius: 12px; padding: 8px 12px;
  }
  .taskbar input[type="text"] { flex: 1 1 260px; width: auto; padding: 7px 10px; font-size: 13px; }
  .taskbar #taskedtitle { font-family: var(--mono); font-size: 11.5px; }
  .taskchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tasklist { display: flex; flex-direction: column; gap: 5px; max-height: 190px; overflow: auto; }
  .taskrow {
    cursor: pointer; display: flex; align-items: baseline; gap: 8px;
    border: 1px solid var(--panel-brd); background: rgba(0,0,0,.25);
    border-radius: 10px; padding: 7px 10px; color: var(--ink-dim); transition: all .15s;
  }
  .taskchips .taskrow { padding: 6px 11px; border-radius: 999px; }
  .taskrow:hover { color: var(--ink); border-color: rgba(249,115,22,.55); background: rgba(249,115,22,.12); }
  .taskrow.act { color: var(--ink); border-color: rgba(249,115,22,.7); background: rgba(249,115,22,.16); }
  .taskrow code { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); margin-left: auto; word-break: break-all; }
  .taskrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); flex: 0 0 auto; }
  .taskrow .dot.on { background: #34d399; box-shadow: 0 0 8px #34d399; }
  /* training: the layer map, the adapter spec, the connection preview */
  .archlist { display: flex; flex-direction: column; gap: 4px; max-height: 58vh; overflow: auto; }
  .archrow {
    cursor: pointer; display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--panel-brd); background: rgba(0,0,0,.22);
    border-radius: 10px; padding: 5px 9px; font-size: 12px; color: var(--ink-dim);
    transition: all .15s;
  }
  .archrow:hover { color: var(--ink); border-color: rgba(249,115,22,.5); }
  .archrow.act { color: var(--ink); border-color: rgba(249,115,22,.7); background: rgba(249,115,22,.16); }
  .archrow .idx { font-family: var(--mono); color: var(--ink-faint); min-width: 62px; }
  .archrow.act .idx { color: var(--ink); }
  .archrow .kind { font-size: 10.5px; border: 1px solid var(--panel-brd); border-radius: 999px; padding: 0 7px; }
  .archrow .kind.hybrid { color: var(--warm); border-color: rgba(251,191,36,.4); }
  .archrow .kind.attn { color: var(--blue); border-color: rgba(229,229,229,.4); }
  .archrow .kind.mtp { color: var(--accent2); border-color: rgba(253,186,116,.4); }
  .archrow .bar { flex: 1; height: 6px; border-radius: 999px; background: rgba(0,0,0,.35); overflow: hidden; min-width: 30px; }
  .archrow .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .archrow .sz { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); min-width: 58px; text-align: right; }
  .tensorlist { display: flex; flex-direction: column; gap: 2px; font-family: var(--mono); font-size: 11.5px; }
  .tensorlist .trow { display: flex; gap: 10px; color: var(--ink-dim); }
  .tensorlist .trow .tname { flex: 1; }
  .tensorlist .trow .tshape, .tensorlist .trow .ttype { color: var(--ink-faint); }
  .tensorlist .trow .tsize { color: var(--ink-faint); min-width: 52px; text-align: right; }
  .adgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-top: 12px; }
  .adgrid label { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--ink-faint); }
  .adgrid select, .adgrid input[type="number"] {
    width: 100%; padding: 6px 9px; font-size: 12px; border-radius: 9px;
    background: rgba(0,0,0,.35); color: var(--ink); border: 1px solid var(--panel-brd);
  }
  .pipeline {
    border: 1px solid var(--panel-brd); background: rgba(0,0,0,.25);
    border-radius: 12px; padding: 10px 12px;
    font-family: var(--mono); font-size: 12px; color: var(--ink-dim);
  }
  .pipeline .pl { margin-bottom: 3px; word-break: break-all; }
  .pipeline .pl b { color: var(--ink); }
  .pipeline .pl.warn { color: var(--warm); }
  /* the data-flow diagram */
  .flowsvg {
    border: 1px solid var(--panel-brd); background: rgba(0,0,0,.22);
    border-radius: 12px; padding: 6px; overflow: auto;
  }
  .flowsvg svg { display: block; }
  .frect { fill: rgba(0,0,0,.28); stroke: var(--panel-brd); }
  .fnode[data-target] { cursor: pointer; }
  .fnode[data-target]:hover .frect { stroke: rgba(249,115,22,.7); }
  .fnode.cat-weight .frect { stroke: rgba(229,229,229,.55); }
  .fnode.cat-scale .frect { stroke: rgba(249,115,22,.6); }
  .flabel { fill: var(--ink); font: 600 12px system-ui; }
  .fsub { fill: var(--ink-faint); font: 11px var(--mono); }
  .fedge { stroke: rgba(255,255,255,.28); stroke-width: 1.4; fill: none; }
  .fedge.dashed { stroke-dasharray: 4 3; }
  .fedge.adapter { stroke: rgba(249,115,22,.85); stroke-dasharray: 5 3; }
  .fedge.residual { stroke: rgba(253,186,116,.75); stroke-width: 1.6; }
  .fedge.replaced { stroke: rgba(255,255,255,.12); stroke-dasharray: 2 3; }
  .freslabel { fill: rgba(253,186,116,.9); font: 11px var(--mono); }
  .fadd { fill: rgba(22,22,22,.95); stroke: rgba(253,186,116,.8); stroke-dasharray: 3 2; stroke-width: 1.4; }
  .opbox.implied { stroke-dasharray: 4 3; }
  /* parameter categories — the stroke colour says what a box holds */
  .opbox.cat-weight { stroke: rgba(229,229,229,.55); }
  .opbox.cat-scale { stroke: rgba(249,115,22,.6); }
  .opbox.cat-bias { stroke: rgba(251,191,36,.65); }
  .opbox.cat-param { stroke: rgba(253,186,116,.55); }
  .opbox.cat-act { stroke: rgba(253,186,116,.7); stroke-dasharray: 4 3; }
  .opbox.cat-mixed { stroke: rgba(229,229,229,.45); }
  .catbadge { fill: rgba(22,22,22,.9); }
  .catpill { font: 600 9.5px var(--mono); }
  .catpill.weight { fill: #e5e5e5; }
  .catpill.scale { fill: #f97316; }
  .catpill.bias { fill: #fbbf24; }
  .catpill.param { fill: #fdba74; }
  .catpill.act { fill: #fdba74; }
  .catpill.mixed { fill: var(--ink-faint); }
  .lgW { color: #e5e5e5; }
  .lgw { color: #f97316; }
  .lgb { color: #fbbf24; }
  .lgp { color: #fdba74; }
  .lga { color: #fdba74; }
  .lgx { color: rgba(253,186,116,.9); }
  /* Step 1: the training UI is one canvas with three boxes (input · layer ·
     output). Every box is drawn by this one card renderer. */
  /* the canvas does not grow with the palette: the row is a fixed height and
     the palette scrolls inside it instead */
  .bxrow { display: flex; gap: 10px; align-items: stretch;
           height: max(420px, calc(100vh - 300px)); min-height: 0; }
  .bxvram { background: rgba(0,0,0,.28); border: 1px solid var(--panel-brd);
            border-radius: 10px; padding: 8px 9px; display: flex; flex-direction: column; gap: 3px; }
  .bxvram .vhead { display: flex; align-items: center; justify-content: space-between;
                   color: var(--ink-dim); font-size: 11.5px; margin-bottom: 2px; }
  .bxvram .vrow { font: 11px/1.45 var(--mono); color: var(--ink); }
  .bxvram .vrow.warn { color: #fca5a5; }
  .bxvram .vrow.w { color: #e5e5e5; }
  .bxvram .vrow.frz { color: #cbd5e1; }
  .bxvram .vrow.kv { color: #fdba74; }
  .bxvram .vrow.tr { color: #fbbf24; }
  .bxvram .vrow.tot { color: #ffffff; font-weight: 700; }
  .bxvram .vrow.sub { color: var(--ink-faint); font-size: 10px; line-height: 1.3; }
  .bxvram .vrow.note { color: var(--ink-dim); }
  .bxvram .vbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden;
                  margin: 1px 0 4px; background: rgba(255,255,255,.07); }
  .bxvram .vbar span { display: block; height: 100%; }
  .bxvram .vbar .w { background: #f97316; }
  .bxvram .vbar .kv { background: #fdba74; }
  .bxvram .vbar .tr { background: #fbbf24; }
  .bxwrap { position: relative; flex: 1 1 auto; min-height: 0; height: 100%;
            border: 1px solid var(--panel-brd); border-radius: 12px; overflow: hidden;
            background: rgba(255,255,255,.03); }
  .bxwrap .flowsvg { position: absolute; inset: 0; }
  .drect { fill: rgba(30,30,30,.97); stroke: rgba(255,255,255,.16); }
  .dnode:hover .drect { stroke: rgba(249,115,22,.8); }
  /* a fill on the base class, so no kind of box can ever fall back to black */
  .dtype { font: 600 10px var(--mono); fill: var(--ink-dim); }
  .dtype.input, .dtype.output { fill: var(--ink-dim); }
  .dtype.layer { fill: #e5e5e5; }
  .dtype.act { fill: #fdba74; }
  .dtype.op { fill: #fbbf24; }
  .dtype.custom { fill: #fdba74; }
  .dtype.script { fill: #fdba74; }
  .dlabel { fill: var(--ink); font: 11.5px var(--mono); }
  .dshape { fill: #fdba74; font: 600 10px var(--mono); text-anchor: end; }
  .dstate { fill: #e5e5e5; opacity: .78; font: 600 10px var(--mono); }
  .dstate.rev { fill: #f0a04b; opacity: 1; }
  .dshape.lower { text-anchor: start; }
  .dshape.fn { fill: #fdba74; }
  .dshape.opfn { fill: #fbbf24; }
  .bxcrumbs { position: absolute; left: 10px; top: 10px; z-index: 6; display: flex;
              align-items: center; gap: 8px; background: rgba(16,16,16,.95);
              border: 1px solid var(--panel-brd); border-radius: 10px; padding: 5px 9px; }
  .bxsel { background: rgba(22,22,22,.9); color: var(--ink); border: 1px solid var(--panel-brd);
           border-radius: 7px; padding: 3px 5px; font-size: 11.5px; }
  .bxsel option { background: #1c1c1c; color: var(--ink); }
  .dshape.unset { fill: var(--ink-faint); }
  .dport { fill: rgba(22,22,22,.95); stroke: rgba(249,115,22,.8); cursor: crosshair; }
  .dport.vis { pointer-events: none; }
  .dport.hit { fill: transparent; stroke: none; pointer-events: all; cursor: crosshair; }
  .dport.hit:hover { fill: rgba(249,115,22,.28); }
  .drail { fill: transparent; pointer-events: all; cursor: crosshair; }
  .drail:hover { fill: rgba(249,115,22,.16); }
  .dedge { fill: none; stroke: rgba(235,235,235,.55); stroke-width: 1.6; }
  .dedge.live { stroke: #fbbf24; stroke-dasharray: 4 3; }
  .dedge.unknown { stroke: #8a8a8a; }
  .dedge.hot { stroke: #fbbf24; stroke-width: 2.4; }
  /* the data flow: a lit box, and light running along its wires */
  .dnode.flow .drect { stroke: #fdba74; stroke-width: 2; }
  /* the training signal: where the labels come from, and what they score */
  .dnode.tsrc .drect { stroke: #86efac; stroke-width: 2; }       /* the data's home */
  .dnode.ttest .drect { stroke: #93c5fd; stroke-width: 2; }      /* the hold-out */
  .dnode.tscored .drect, .dnode.tpolicy .drect,
  .dnode.tscorer .drect { stroke: #fbbf24; stroke-width: 2.2; }  /* the signal's head */
  .dedge.tgrad { stroke: #86efac; stroke-width: 2; stroke-dasharray: 5 9;
                 animation: bxflow .5s linear infinite reverse; } /* gradients run backward */
  .dtag { font-size: 9px; font-weight: 700; }
  .dtag.tsrc { fill: #86efac; }
  .dtag.ttest { fill: #93c5fd; }
  .dtag.tscored, .dtag.tpolicy, .dtag.tscorer { fill: #fbbf24; }
  .dringbg { fill: none; stroke: #33383d; stroke-width: 4; }
  .dring { fill: none; stroke: #fdba74; stroke-width: 4; stroke-linecap: round; }
  .dringnum { fill: #c9c9c9; font-size: 8px; text-anchor: middle; }
  /* the agent box's display: a real window inside the card (foreignObject) */
  .bxlogfo { overflow: hidden; }
  .bxlogpane { position: relative; width: 100%; height: 100%; display: flex;
               flex-direction: column; background: #14171a; border: 1px solid #2a2f34;
               border-radius: 8px; overflow: hidden; font-size: 12px; color: #c9ced3; }
  /* the dataset box is a card like every other box; its sheet sits inset
     inside the card as a flat grid of square block cells — straight lines
     only, and a cell being edited keeps the square highlight, never a text
     box */
  .bxflat { border: 0 !important; border-radius: 0 !important; }
  .bxsheet { overflow: auto; }
  .bxdf { border-collapse: collapse; width: 100%; font-size: 11.5px;
          table-layout: fixed; border-radius: 0; }
  .bxdf th, .bxdf td {
    border: 1px solid #2f353b; padding: 0; height: 22px;
    border-radius: 0;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .bxdf .bxcorner { background: #1b1f23; width: 34px; border-color: #262b30; }
  .bxdf .bxname { background: #1b1f23; position: relative; padding: 0; }
  .bxnamehost { display: flex; align-items: center; }
  .bxnameslot { flex: 1 1 auto; min-width: 0; overflow: hidden; }
  .bxname .bxcolbtn { visibility: hidden; cursor: pointer; padding: 0 3px;
                      color: #8a8a8a; font-family: var(--mono);
                      font-size: 10px; font-weight: 600; }
  .bxname:hover .bxcolbtn { visibility: visible; }
  .bxname .bxcolbtn:hover { color: #f97316; }
  .bxval { padding: 3px 6px; overflow: hidden; text-overflow: ellipsis;
           white-space: nowrap; cursor: cell; color: #c9ced3;
           font: 11.5px/1.6 var(--mono); }
  .bxval.bxnum { text-align: right; }
  .bxval.bxdim { color: #4b5563; }
  .bxnameval { padding: 4px 6px; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; cursor: text; color: #e5e5e5;
               font: 600 11px/1.5 var(--mono); }
  .bxnameval.bxdim { color: #4b5563; font-weight: 400; }
  .bxcolname, .bxcell {
    width: 100%; height: 100%; border: 0; border-radius: 0;
    background: rgba(249,115,22,.10); color: #e5e5e5;
    font: 11.5px/1.6 var(--mono); padding: 3px 6px;
    outline: none; appearance: none; -webkit-appearance: none; }
  .bxcolname { font-weight: 600; }
  .bxcolname:focus, .bxcell:focus { box-shadow: inset 0 0 0 2px #f97316; }
  .bxdtype { position: absolute; right: 8px; top: 3px; font-size: 9px;
             color: #6b7280; background: transparent;
             padding: 0 4px; border: 0; border-left: 1px solid #2f353b;
             cursor: pointer; font-family: var(--mono); border-radius: 0; }
  .bxdtype:hover { color: #f97316; }
  .bxcolgrip { position: absolute; right: -3px; top: 0; width: 7px; height: 100%;
               cursor: col-resize; z-index: 2; }
  .bxdf .bxrowno { background: #1b1f23; color: #6b7280; text-align: center;
                   font-family: var(--mono); font-size: 10px; width: 34px;
                   user-select: none; }
  .bxdel { cursor: pointer; color: #6b7280; text-align: center; width: 22px; }
  .bxdel:hover { color: #f87171; }
  .bxthumb { max-height: 46px; max-width: 100%; display: block; cursor: zoom-in; }
  .bxfile { color: #a3a3a3; font-family: var(--mono); font-size: 10px;
            padding: 4px 6px; cursor: pointer; }
  .bxfile:hover { color: #f97316; }
  .bxlight { position: fixed; inset: 0; background: rgba(0,0,0,.82);
             display: flex; align-items: center; justify-content: center;
             z-index: 1000; cursor: zoom-out; }
  .bxlight img, .bxlight video { max-width: 88vw; max-height: 84vh; }
  .bxhint2 { padding: 3px 8px; color: #8a8a8a; font-size: 11px; }
  .bxhint2.warn { color: #fbbf24; }
  .bxlink { color: #a3a3a3; cursor: pointer; padding: 0 4px; }
  .bxlink:hover { color: #f97316; }
  .bxgrip { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px;
            cursor: nwse-resize;
            background: linear-gradient(135deg, transparent 45%, #3b4248 45%,
                        #3b4248 55%, transparent 55%, transparent 68%, #3b4248 68%,
                        #3b4248 78%, transparent 78%); }

<body>

<header>
  <div class="logo">nn<span>·</span>studio</div>
  <div class="sub">compose the network on the canvas, wire it, price it, then run it</div>
</header>

<main>
  <section id="view-training" class="view">
    <div class="bxtools" id="bxtools">
      <span class="bxtbtn" id="bxtFiles" title="the design as JSON">Files ▾</span>
      <div class="bxtdrop" id="bxtFilesMenu" hidden></div>
      <span class="bxtbtn" id="bxtDocs" title="the handbook: what this is, how to use the boxes"
            onclick="window.open('/docs', '_blank')">Docs</span>
      <span class="bxtbtn" id="bxtPalette" title="add a box to the canvas">Palette ▾</span>
      <div class="bxtdrop" id="bxtPalMenu" hidden></div>
      <span class="bxtbtn" id="bxtBackend" title="where the heavy work runs">Backend ▾</span>
      <div class="bxtdrop" id="bxtBackendMenu" hidden></div>
      <span class="bxtbtn off" id="bxtRunBtn" title="show the Run box">Run</span>
      <span class="bxtspace"></span>
      <span class="bxtbtn" id="bxtVram" title="the VRAM estimate">VRAM ▾</span>
      <div class="bxtdrop bxtdrop-r" id="bxtVramMenu" hidden>
        <div class="bxvram" id="bxvram"></div>
      </div>
    </div>
    <div class="bxrow">
      <div class="bxwrap" id="bxwrap">
        <div class="flowsvg" id="bxcanvas"></div>
        <div class="bxmenu" id="bxmenu" hidden></div>
      </div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

// Tiny element builder: mk("div", {class: "x", text: "hi", onclick: fn}, kid...)
function mk(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el[k] = v;
  }
  for (const kid of kids) if (kid) el.appendChild(kid);
  return el;
}

// SVG sibling of mk: attributes go through setAttribute (SVG needs it).
function svg(tag, attrs = {}, ...kids) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids) if (kid) el.appendChild(kid);
  return el;
}
function svgText(x, y, text, cls) {
  return svg("text", { x, y, class: cls, text });
}

// ---------------------------------------------------------------- training
// Step 1: the training UI is one canvas and three boxes.
//   input  — one output dot on its right edge
//   output — one input dot on its left edge
//   layer  — an input dot on the left, an output dot on the right
//   op     — a static operation: transpose, dot product, arithmetic, reshape
// Every box is drawn by the same card renderer (rounded body, rails, dots and
// typefaces — the canvas has one look). The canvas is the whole UI:
//   right-click empty space → add a box (it asks for the size)
//   right-click a box       → remove it
//   drag a box              → move it
//   drag a dot / rail       → wire it (one wire per input dot)
//   drag the background     → pan;  wheel → zoom
const BXW = 160, BXH = 80;                 // every box is exactly this size —
                                           // 4 × 2 whole cells of the 40 grid
const BX_GRID = 40;                        // the breadboard's base step
let BX = { nodes: [], edges: [], view: { cx: null, cy: null, k: 1 }, stack: [], up: null,
           model: null };
let bxDrag = null, bxWire = null, bxBend = null, bxMenuAt = null, bxDropIn = null;
let bxGuides = [], bxMarqueeRect = null;
// what is selected: { kind: "boxes", ids } | { kind: "edge", from, to } | null.
// A click selects (a drag never does), Delete removes the selection.
let bxSel = null;
let bxCopied = null, bxPasteAt = null, bxMouse = null;   // copy & paste
let bxHotEdge = null, bxHotBadge = null, bxVisPaths = new Map();

function bxId() { return "bx" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function bxNode(id) { return BX.nodes.find(n => n.id === id) || null; }
// The boxes/edges we are editing may be a custom box's own lists (after going
// inside). Mutations replace those arrays, so the box has to be pointed at the
// new ones — otherwise its saved network goes stale (invisible wires on re-entry).
function bxSyncDoc() {
  if (!BX.up || !BX.stack || !BX.stack.length) return;
  const top = BX.stack[BX.stack.length - 1];
  const box = (top.nodes || []).find(n => n.id === BX.up);
  if (box && box.inner) {
    box.inner.nodes = BX.nodes;
    box.inner.edges = BX.edges;
  }
}
// ---------------------------------------------------------------- undo / redo
// Every completed action (a box added, moved, configured or removed; a wire
// drawn, bent or cut; a canvas loaded; a box moved into a nested box) leaves a
// snapshot of the whole design behind it, so Ctrl+Z walks back through them —
// wherever you were when it happened — and Ctrl+Shift+Z (or Ctrl+Y) walks
// forward again. Panning, zooming and going in/out of boxes are not actions.
let bxUndoStack = [], bxRedoStack = [], bxUndoLock = 0, bxUndoLast = "";
function bxUndoDepth() { return { undo: bxUndoStack.length, redo: bxRedoStack.length }; }
function bxCurrentPath() {                     // the boxes we are inside, outermost first
  return (BX.stack || []).map(s2 => s2.up).concat([BX.up]).filter(id => !!id);
}
function bxSnapshotNow() {
  const root = (BX.stack && BX.stack.length) ? BX.stack[0] : { nodes: BX.nodes, edges: BX.edges };
  const path = bxCurrentPath();
  return { doc: JSON.parse(JSON.stringify({ nodes: root.nodes || [], edges: root.edges || [] })),
           model: BX.model ? JSON.parse(JSON.stringify(BX.model)) : null,
           sel: bxSel ? JSON.parse(JSON.stringify(bxSel)) : null,
           path: path };
}
let bxDataState = {};                          // what the last run left on the data boxes
let bxRunValues = {};                          // every value of the last run, by full path
                                               // (so any nesting level can show its own)
let bxFlowSet = new Set();                     // full paths the run has marked done
let bxFlowNow = null;                          // the newest mark — where data is now
let bxFlowRendered = 0;                        // batched draws: one per 40 ms
let bxFlowPending = null;                      // the throttled draw, when one is due
let bxFlowStep = null;                         // the forward pass the marks belong to
let bxTrainTint = null;                        // the training signal's marks, at this level
let bxRunErr = null;                           // the block a failed run pointed at
let bxAudit = null;                            // connection problems on the design
function bxCommit() {
  if (bxUndoLock) return;                      // a composite action is still running
  bxDataState = {};                            // an edit invalidates the last run
  bxRunValues = {};
  bxFlowClear();
  bxRunErr = null;
  bxAudit = null;
  const snap = bxSnapshotNow();
  const text = JSON.stringify(snap);
  if (text === bxUndoLast) return;             // nothing moved: no new step
  bxUndoStack.push(snap);
  if (bxUndoStack.length > 60) bxUndoStack.shift();
  bxUndoLast = text;
  bxRedoStack = [];
}
function bxRestore(snap, path) {
  const targetPath = path || snap.path || [];
  // undoing must not move the canvas: keep the camera whenever it lands on the
  // level we are already looking at
  const keepView = bxCurrentPath().join(">") === targetPath.join(">");
  const view = { cx: BX.view.cx, cy: BX.view.cy, k: BX.view.k };
  const doc = JSON.parse(JSON.stringify(snap.doc));
  BX.stack = [];
  BX.up = null;
  BX.nodes = doc.nodes || [];
  BX.edges = doc.edges || [];
  BX.model = snap.model ? JSON.parse(JSON.stringify(snap.model)) : null;
  BX.view = { cx: null, cy: null, k: 1 };
  bxSel = null;
  for (const id of targetPath) {               // back to where the change was made
    const n = bxNode(id);
    if (!n || n.kind !== "custom") break;
    bxEnter(id);
  }
  if (keepView) BX.view = view;                // …with the canvas exactly where it was
  if (snap.sel) {                              // and with what was selected then
    if (snap.sel.kind === "boxes") bxSelectBoxes(snap.sel.ids);
    else bxSelect(snap.sel);
  }
  bxSettleSizes();
  bxRender();
  bxRenderPalette();
}
function bxUndoStep() {
  if (bxUndoStack.length < 2) return false;
  const cur = bxUndoStack.pop();               // the state being left behind
  bxRedoStack.push(cur);
  const snap = bxUndoStack[bxUndoStack.length - 1];
  bxUndoLast = JSON.stringify(snap);
  bxRestore(snap, cur.path);                   // stand where that action happened
  return true;
}
function bxRedoStep() {
  if (!bxRedoStack.length) return false;
  const snap = bxRedoStack.pop();
  bxUndoStack.push(snap);
  bxUndoLast = JSON.stringify(snap);
  bxRestore(snap, snap.path);                  // redo lands where its action was
  return true;
}
function bxDim(d) { return d == null ? "?" : String(d); }
function bxSize(x, keep) {
  if (x === undefined) return keep === undefined ? null : keep;  // not given: leave it
  if (x === null || x === "") return null;                       // cleared: unconfigured
  const v = Number(x);
  return isFinite(v) ? Math.max(1, Math.round(v))                // a real size
                     : (keep === undefined ? null : keep);       // junk keeps what was there
}
function bxNum(x, keep) {                       // a positive number, unrounded (an eps, a rope base)
  if (x === undefined) return keep === undefined ? null : keep;
  if (x === null || x === "") return null;
  const v = Number(x);
  return isFinite(v) && v > 0 ? v : (keep === undefined ? null : keep);
}
function bxEpsText(v) { const x = Number(v); return x >= 0.001 ? String(x) : x.toExponential(0); }
// ---------------------------------------------------------------- dtype & size
// The picker's dtypes, in two families: **torch**'s own storage types and the
// **gguf** quant formats (k-quants carry their block overhead). Bytes per
// weight drive the VRAM estimate; the engine casts any of them where it runs.
const BX_DTYPE_GROUPS = [
  ["torch", [["f64", 8], ["f32", 4], ["bf16", 2], ["f16", 2],
             ["f8_e4m3", 1], ["f8_e5m2", 1],
             ["i64", 8], ["i32", 4], ["i16", 2], ["i8", 1],
             ["u8", 1], ["bool", 1]]],
  ["gguf", [["q8_0", 1.0625], ["q8_k", 1.0625], ["q6_k", 0.828125],
            ["q5_k", 0.703125], ["q5_1", 0.75], ["q5_0", 0.6875],
            ["q4_k", 0.5625], ["q4_1", 0.625], ["q4_0", 0.5625],
            ["iq4_xs", 0.515625], ["iq4_nl", 0.5625], ["q3_k", 0.4375],
            ["iq3_s", 0.4375], ["iq3_xxs", 0.375], ["q2_k", 0.34375],
            ["iq2_s", 0.28125], ["iq2_xs", 0.25], ["iq1_s", 0.1875]]],
];
const BX_DTYPES = {};
for (const [, dts] of BX_DTYPE_GROUPS) for (const [d, b] of dts) BX_DTYPES[d] = b;
function bxDtypeFill(sel, current, fallback) {   // a select, grouped by family

  const x0 = ev.clientX || 0;
  const th = ev.target && ev.target.parentNode;
  let w = (n.colw && Number(n.colw[i])) || (th && th.offsetWidth) || 120;
  const w0 = w;

    const col = table && table.querySelectorAll
      ? table.querySelectorAll(".bxcol" + i)[0] : null;
    if (col && col.style) col.style.width = w + "px";
  };
  const up = () => {
    if (typeof window !== "undefined" && window.removeEventListener) {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
    }
    const cw = (n.colw || []).slice();
    while (cw.length <= i) cw.push(0);
    cw[i] = w;
    n.colw = cw.some(x => x) ? cw : null;
    bxCommit();
    bxRender();
  };

    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);

function bxJSONForm(mode, node, ev) {
  const m = $("bxmenu");
  if (!m) return;
  const isExport = mode === "export";
  m.innerHTML = "";
  const wrap = mk("div", { class: "bf" });
  const ta = mk("textarea", { class: "bxjson", spellcheck: "false",
    placeholder: node ? "paste a nested design here"
                      : "paste a canvas or a nested design here" });
  if (isExport) {
    ta.value = JSON.stringify(node ? bxExportNested(node.id) : bxExportCanvas(), null, 2);
    ta.readOnly = true;
  }
  wrap.appendChild(ta);
  const row = mk("div", { class: "row" });
  const chip = (text, fn) => {
    const c = mk("span", { class: "chip tiny", text });
    c.addEventListener("click", fn);
    row.appendChild(c);
    return c;
  };
  if (isExport) {
    chip("select all", () => { if (ta.focus) ta.focus(); if (ta.select) ta.select(); });
    chip("close", bxMenuClose);
  } else {
    const warn = mk("div", { class: "warnbx",
      text: "loading this canvas replaces everything already on the canvas" });
    warn.hidden = true;
    let armed = false;
    chip("cancel", bxMenuClose);
    const go = chip("load", () => {
      const where = node ? { box: node.id } : (ev ? bxPoint(ev) : { x: 0, y: 0 });
      const read = bxJSONRead(ta.value, where);
      if (!read.ok) { if (ta.classList) ta.classList.add("bad"); return; }  // refused, silently
      if (read.replaces && !armed) {           // a canvas over work: warn first
        armed = true;
        warn.hidden = false;
        go.textContent = "overwrite";
        bxMenuPlace();                         // the form grew: fit it again
        return;
      }
      bxJSONApply(read, where);
      bxMenuClose();
    });
    ta.addEventListener("input", () => { if (ta.classList) ta.classList.remove("bad"); });
    wrap.appendChild(warn);
  }
  wrap.appendChild(row);
  m.appendChild(wrap);

function bxtRunLoad() {                        // the whole design, loaded warm
  bxApplyOffload("gpu");                       // the ratio writes the places
  const canvas = bxExportCanvas();
  if (!canvas) return;
  const ratio = bxOffloadRatio();
  BXRUN.loading = true;
  BXRUN.loadKey = "load";
  BXRUN.error = false;
  BXRUN.msg = "loading the whole design\u2026"
              + (ratio ? " (" + ratio + "% on the system)" : "");
  bxtRunSync();
  bxUsageWatch(true);                          // watch the memory move while it loads
  let prog = 0;                                // and how far the compile is
  if (typeof setInterval === "function")
    prog = setInterval(() => {
      fetch("/api/run/progress", { cache: "no-store" })
        .then(r => (r.ok ? r.json() : null))
        .then(d => {
          const ld = d && d.progress && d.progress.load;
          if (!ld || !ld.total || !BXRUN.loading) return;
          BXRUN.msg = "loading\u2026 " + (100 * ld.bytes / ld.total).toFixed(0)
                    + "% \u00b7 " + bxGB(ld.bytes) + " / " + bxGB(ld.total);
          bxtRunSync();
        })
        .catch(() => {});
    }, 900);
  const name = (BXRUN.local.agent && BXRUN.local.agent.name) || "the backend";
  fetch("/api/load", { method: "POST", headers: { "Content-Type": "application/json" },
                       body: JSON.stringify({ canvas, mode: BXRUN.mode || "inference" }) })
    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(res => {
      BXRUN.loading = false;
      if (prog) clearInterval(prog);
      bxUsageWatch(false);
      if (!res.ok || !res.d || !res.d.ok)
        throw new Error((res.d && res.d.error) || "the load failed");
      BXRUN.loaded = res.d;
      BXRUN.warmMode = (res.d && res.d.mode) || null;
      BXRUN.msg = "";
      bxtRunSync();
      fetchBackend();                          // the agent just measured — show it now
    })
    .catch(e => {
      BXRUN.loading = false;
      if (prog) clearInterval(prog);
      bxUsageWatch(false);
      BXRUN.warmMode = null;                   // a failed load frees the backend's weights
      BXRUN.error = true;                      // it stays until the next load/run
      bxtRunMsg("could not load on " + name + " \u2014 " + String((e && e.message) || e));
      fetchBackend();
    });

              BX.edges.every(e => (e.from !== n.id && e.to !== n.id) ||

const BX_TASK_TYPES = {

function bxTask(id) { return (id && BXTASKS.byId[id]) || null; }

// ---- the API: the task list, its stream, its controls ----------------------
function bxTasksFetch(cb) {
  if (typeof fetch !== "function") { if (cb) cb(null); return; }
  fetch("/api/tasks", { cache: "no-store" })
    .then(r => (r.ok ? r.json() : null))
    .then(d => {
      bxTasksApply((d && d.tasks) || []);
      for (const t of BXTASKS.list) {         // a landed task refreshes its model
        if (t.status === "done" && t.outcome === "exact"
            && t.params && t.params.repo && !BXTASKS.refreshed) {
          BXTASKS.refreshed = BXTASKS.refreshed || {};
          if (!BXTASKS.refreshed[t.id]) {
            BXTASKS.refreshed[t.id] = true;
            for (const n of BX.nodes || []) {
              if (n.kind === "custom" && n.repo === t.params.repo
                  && typeof bxRefreshCanvas === "function")
                bxRefreshCanvas(n.id, t.params.repo, null);

      if (cb) cb(d);

    .catch(() => { if (cb) cb(null); });
}

                        body: JSON.stringify({ type: type, params: params }) })
    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(res => {
      const t = res.d && res.d.task;
      if (!res.ok || !res.d || !res.d.ok) {

        return;

                            body: JSON.stringify(Object.assign({ task: id, cmd: cmd },

    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(res => {

        delete BXTASKS.log[res.d.deleted];

    .catch(() => { if (cb) cb(null); });
}
function bxLogState(id) {

}

  const st = bxLogState(id);                   // updates in place, token by token
  for (const it of items || []) {

    if (i != null && it.append) {

                      text: (st.items[i].text || "") + it.text };
    } else if (i != null) {

    .then(r => (r.ok ? r.json() : null))

function bxAgentSync() {                       // every pane follows the state, live
  const root = bxHost() && bxHost().querySelector ? bxHost().querySelector(".bxsvg") : null;
  if (root && root.querySelectorAll) {
    for (const pane of root.querySelectorAll(".bxlogpane")) {
      const id = pane.getAttribute ? pane.getAttribute("data-agent") : null;
      const n = id ? bxNode(id) : null;
      if (!n) continue;
      if (n.kind === "dataset") bxDatasetFill(pane, n);
      else if (n.kind === "train") bxTrainFill(pane, n);
      else bxAgentFill(pane, n);

  const sig = JSON.stringify(BXTASKS.list.map(t =>
    [t.id, t.status, t.outcome, t.phase, (t.todo || []).map(x => x.state).join("")]));

function bxAgentTick(now) {                    // one log poll for every live box

    if (n.kind !== "agent" && n.kind !== "train") return false;
    if (!n.task_id) return n.kind === "train";  // a hub with no task still wants the list
    const t = bxTask(n.task_id);
    if (!t) return n.kind === "train";          // unknown task: the box knows best
    return t.status === "running" || t.status === "paused";
  });
  const pullLogs = () => {
    for (const n of BX.nodes || [])
      if (n.kind === "agent" && n.task_id) bxTaskLogFetch(n.task_id, bxAgentSync);
  };
  const pullList = () => bxTasksFetch(bxAgentSync);
  if (now) { pullList(); pullLogs(); }
  if (!BXTASKS.timer && any) {
    BXTASKS.timer = setInterval(pullLogs, 300);  // token by token, as it writes
    BXTASKS.timer2 = setInterval(pullList, 2000); // the list: state, not tokens
  }
  if (BXTASKS.timer && !any) {
    clearInterval(BXTASKS.timer);
    clearInterval(BXTASKS.timer2);
    BXTASKS.timer = BXTASKS.timer2 = null;
  }
}
function bxRefreshCanvas(boxId, repo, audit) {

                              body: JSON.stringify({ repo }) })
    .then(r => r.json())
    .then(d => {
      if (!d || !d.canvas || bxNode(boxId) == null) return;
      bxGGUFLoad(boxId, d.canvas, null);       // the exact inside, same box
      bxMarkAudit(audit || (d.canvas.model && d.canvas.model.audit));
      bxRender();

// ---- a model box must know where its tensors live -------------------------
// A design can outlive the browser session that loaded it; boxes remember the
// file now, but one saved before that (or one whose file was cleared) can be
// bound back from its own name — the app lists the models, one name wins.
let bxModels = null;                           // /api/models, fetched once

function bxInnerBinds(n) {                     // does its inside read tensors?
  const some = (doc) => ((doc && doc.nodes) || []).some(x =>
    (x.t && x.kind !== "custom") || (x.kind === "custom" && some(x.inner)));
  return some(n && n.inner);
}

function bxMissingFiles(n, inherited) {        // tensors with no file in reach
  const file0 = n && n.file ? n.file : inherited;
  let miss = 0;
  for (const x of ((n && n.inner && n.inner.nodes) || [])) {
    const file = x.file || file0;
    if (x.kind === "custom") miss += bxMissingFiles(x, file);
    else if (x.t && !file) miss++;

  return miss;
}

function bxModelNeeded(n) {                    // a tensor box with no file in reach
  return !!(n && n.kind === "custom" && !n.file && bxMissingFiles(n, null) > 0);
}

function bxUnboundModels(nodes, inherited) {   // the top boxes that need one
  const out = [];
  for (const n of nodes || []) {
    const file = n.file || inherited;
    if (n.kind !== "custom") continue;
    if (!n.file && bxMissingFiles(n, file) > 0) {
      out.push(n);                             // binding it covers its inside
      continue;
    }
    out.push(...bxUnboundModels(n.inner && n.inner.nodes, file));
  }
  return out;
}

function bxModelMatch(box, models) {           // the one file whose name fits
  const want = String((box && box.name) || "").trim().toLowerCase();
  if (!want) return null;
  const hits = (models || []).filter(m => m.kind === "gguf" &&
    (String(m.name || "").toLowerCase().startsWith(want) ||
     String(m.path || "").toLowerCase().split("/").pop().startsWith(want)));
  return hits.length === 1 ? hits[0] : null;
}

function bxBindModels(nodes, models, inherited) {
  const bound = [], missing = [];
  const walk = (list, parentFile) => {
    for (const n of list || []) {
      const file = n.file || parentFile;
      if (n.kind === "custom") {
        if (!file && bxModelNeeded(n)) {
          const hit = bxModelMatch(n, models);
          if (hit) { n.file = bxClip(hit.path, 300); bound.push(n); }
          else missing.push(n);
        }
        walk(n.inner && n.inner.nodes, n.file || file);
      }

    if (r.bound.length) {

      bxRender();

    if (r.missing.length) {
      bxtRunMsg("\u201c" + r.missing.map(n => n.name || "model").join(", ")
                + "\u201d has no model file bound \u2014 load its GGUF again "
                + "(Palette \u2192 gguf)");

    return false;

  if (typeof fetch === "function" && !bxRunFixing) {

// The app asks the server what is inside a weight file (/api/weights/meta) —
// gguf, safetensors and pt alike — and shows every tensor with its shape and
// dtype. The block's name is matched against the names so the right one is
// flagged; binding stores {file, t} in the design, and the backend loads those
// weights instead of the random init. The tensor's shape also sizes the block.
function bxWeightScore(boxName, tensorName) {
  const norm = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const needle = norm(boxName);
  if (!needle) return 0;
  const cols = norm(tensorName).split(" ").filter(Boolean);
  const tail = cols.length ? cols[cols.length - 1] : "";
  if (tail === "weight") cols.pop();
  let score = 0;
  for (const w of needle.split(" ")) if (w && cols.indexOf(w) >= 0) score++;
  if (norm(tensorName).indexOf(needle) >= 0) score += 2;
  if (score > 0) {                             // of a weight/bias pair, prefer the weight
    if (tail === "weight") score += 0.5;
    else if (tail === "bias") score -= 0.5;
  }
  return score;
}
function bxTensorDims(n, shape) {
  const sh = (shape || []).map(Number).filter(x => !isNaN(x) && x > 0);
  const out = {};
  if (n.kind === "layer" && sh.length >= 2) { out.dout = sh[0]; out.din = sh[sh.length - 1]; }
  else if (n.kind === "embed" && sh.length >= 2) { out.vocab = sh[0]; out.dout = sh[1]; }
  else if ((n.kind === "norm" || n.kind === "op") && sh.length === 1) out.din = sh[0];
  return out;
}
function bxTensorDtype(name) {
  const s = String(name || "").toUpperCase().replace("TORCH.", "");
  const map = { F32: "f32", FLOAT32: "f32", F16: "f16", FLOAT16: "f16",
                BF16: "bf16", BFLOAT16: "bf16", F64: "f64", FLOAT64: "f64",
                F8_E4M3: "f8_e4m3", FLOAT8_E4M3FN: "f8_e4m3",
                F8_E5M2: "f8_e5m2", FLOAT8_E5M2: "f8_e5m2",
                I8: "i8", INT8: "i8", U8: "u8", UINT8: "u8",
                I16: "i16", INT16: "i16", I32: "i32", INT32: "i32",
                I64: "i64", INT64: "i64", BOOL: "bool" };
  return map[s] || null;                       // quantized/other: leave the dtype alone
}
function bxWeightsApply(n, file, tensor) {
  if (!n || !tensor) return false;
  const v = { file: file || "", t: tensor.name };
  const dims = bxTensorDims(n, tensor.shape);
  for (const k of Object.keys(dims)) v[k] = dims[k];
  const dt = bxTensorDtype(tensor.dtype);
  if (dt && BX_DTYPES[dt] != null) v.dtype = dt;

}
function bxApplyManifest(file, tensors) {      // an export: every box -> its keys
  const by = {};
  for (const t of tensors || []) (by[t.id] = by[t.id] || []).push(t.key);
  let count = 0;
  bxEveryBox(box => {
    if (!bxWeightedBox(box)) return;
    const keys = by[box.id];
    if (keys && keys.length) { box.file = file; box.t = keys.join(","); count++; }
  });

  bxCommit();
  return count;
}

  const id = nodeEl && nodeEl.getAttribute ? nodeEl.getAttribute("data-id") : null;
  const n = id ? bxNode(id) : null;
  const out = t && t.closest ? (t.closest(".dport.out") || t.closest(".drail.out")) : null;
  const inn = t && t.closest ? (t.closest(".dport.in") || t.closest(".drail.in")) : null;
  if (out && n && n.kind !== "output") { bxStartWire(ev, n); return; }
  if (inn && n && n.kind !== "input") { ev.preventDefault(); if (ev.stopPropagation) ev.stopPropagation(); return; }
  const wire = t && t.closest ? t.closest(".dedge-hit") : null;
  if (wire && wire.getAttribute) {
    const e = bxFindEdge(wire.getAttribute("data-from"), wire.getAttribute("data-to"));
    if (e) { bxStartWireShape(ev, e); return; }
  }
  if (n) {
    ev.preventDefault();
    if (ev.stopPropagation) ev.stopPropagation();
    if (ev.shiftKey) { bxToggleSelect(n.id); return; }        // shift+click picks boxes one by one
    const ids = bxSelectedIds();
    if (ids.indexOf(n.id) < 0) bxSelectBoxes([n.id]);         // a plain click starts a fresh selection
    bxStartMove(ids.indexOf(n.id) >= 0 ? ids : [n.id], n.id, ev.clientX || 0, ev.clientY || 0);
    return;
  }
  ev.preventDefault();
  if (ev.shiftKey) {                                          // shift+drag draws a marquee
    const p0 = bxPoint(ev);
    bxDrag = { kind: "marquee", sx: ev.clientX || 0, sy: ev.clientY || 0 };
    bxMarqueeRect = { x0: p0.x, y0: p0.y, x1: p0.x, y1: p0.y };
    bxRender();
    return;
  }
  const c = bxCenter();
  bxDrag = { kind: "pan", sx: ev.clientX || 0, sy: ev.clientY || 0, cx0: c.cx, cy0: c.cy, moved: false };
}
function bxStartWireShape(ev, edge) {
  ev.preventDefault();
  if (ev.stopPropagation) ev.stopPropagation();
  bxBend = { edge, sx: ev.clientX || 0, sy: ev.clientY || 0, moved: false };
}
function bxStartWire(ev, n) {
  ev.preventDefault();
  if (ev.stopPropagation) ev.stopPropagation();
  const host = bxHost();
  const root = host && host.querySelector ? host.querySelector("svg") : null;
  if (!root) return;
  const t = ev.target;
  const el = t && t.closest ? (t.closest(".dport.out") || t.closest(".drail.out")) : null;
  const fromPort = Number((el && el.getAttribute ? el.getAttribute("data-port") : 0) || 0);
  const fromCount = Math.max(1, bxPortDefs(n, "out").length);
  const p = bxPortPos(n, "out", fromPort, fromCount);
  const path = svg("path", { d: "M " + p.x + " " + p.y, class: "dedge live" });
  root.appendChild(path);
  bxWire = { from: n, fromPort, fromCount, path };
}
function bxBadDrop(ev) {
  if (!bxWire) return false;
  const t = (document.elementFromPoint && ev) ? document.elementFromPoint(ev.clientX, ev.clientY) : null;
  const port = t && t.closest ? t.closest(".dport.in") : null;
  const toId = port && port.getAttribute ? port.getAttribute("data-node") : null;
  const toPort = port && port.getAttribute ? Number(port.getAttribute("data-port") || 0) : 0;
  return toId ? !!bxCheckLink(bxWire.from.id, toId, bxWire.fromPort, toPort).error : false;
}
function bxMove(ev) {
  if (bxBend) {                         // drag the wire itself: bend it
    const dx = (ev.clientX || 0) - bxBend.sx, dy = (ev.clientY || 0) - bxBend.sy;
    if (!bxBend.moved && Math.abs(dx) + Math.abs(dy) < 3) return;
    bxBend.moved = true;
    const p = bxPoint(ev);
    bxSetVia(bxBend.edge, bxSnapTo(p.x), bxSnapTo(p.y));       // bends sit on the grid
    return;
  }
  if (bxWire) {
    const t = bxPoint(ev);
    const p = bxPortPos(bxWire.from, "out", bxWire.fromPort, bxWire.fromCount);
    const dx = Math.max(40, Math.abs(t.x - p.x) * 0.4);
    if (bxWire.path) {
      bxWire.path.setAttribute("d",
        "M " + p.x + " " + p.y + " C " + (p.x + dx) + " " + p.y + ", " +
        (t.x - dx) + " " + t.y + ", " + t.x + " " + t.y);
      bxWire.path.setAttribute("class", "dedge live" + (bxBadDrop(ev) ? " bad" : ""));
    }
    return;
  }
  if (!bxDrag) return;
  const dx = (ev.clientX || 0) - bxDrag.sx, dy = (ev.clientY || 0) - bxDrag.sy;
  if (!bxDrag.moved && Math.abs(dx) + Math.abs(dy) < 3) return;   // a click, not a drag
  bxDrag.moved = true;
  if (bxDrag.kind === "marquee") {
    const p = bxPoint(ev);
    if (bxMarqueeRect) { bxMarqueeRect.x1 = p.x; bxMarqueeRect.y1 = p.y; }
    bxRender();
    return;
  }
  if (bxDrag.kind === "move") {
    const k = bxCenter().k;                 // screen pixels → world units
    const snap = bxSnapMove(bxNode(bxDrag.id), bxDrag.x0 + dx / k, bxDrag.y0 + dy / k);
    bxGuides = snap.guides;
    const ox = snap.x - bxDrag.x0, oy = snap.y - bxDrag.y0;   // the grabbed box sets the delta
    for (const id of (bxDrag.ids || [bxDrag.id])) {
      const st = bxDrag.starts && bxDrag.starts[id];
      const n = bxNode(id);
      if (n && st) { n.x = Math.round(st.x + ox); n.y = Math.round(st.y + oy); }
    }
    bxRender();
    const over = bxDropTargetAt(ev);        // hovering a nested box: show it
    if (over !== bxDropIn) {
      const root = bxHost() && bxHost().querySelector ? bxHost().querySelector("svg") : null;
      if (root && root.querySelectorAll)
        for (const g of root.querySelectorAll(".dnode.dropin")) g.classList.remove("dropin");
      bxDropIn = over;
      if (over && root) {
        const g = root.querySelector('.dnode[data-id="' + over + '"]');
        if (g && g.classList) g.classList.add("dropin");
      }
    }
    return;
  }
  const k = bxCenter().k;
  BX.view = { cx: bxDrag.cx0 - dx / k, cy: bxDrag.cy0 - dy / k, k };
  bxClampView();                             // the origin can never be lost
  const root = bxHost() && bxHost().querySelector ? bxHost().querySelector("svg") : null;
  if (root) root.setAttribute("viewBox", bxViewBox());
  bxGridRefresh();                           // panning only moves the viewBox
}
function bxUp(ev) {
  if (bxBend) {                         // dropped: near the straight middle = snap flat
    const g = bxBend;
    bxBend = null;
    if (g.moved) bxCommit();            // the new shape is one step
    if (!g.moved) {
      bxSelect({ kind: "edge", from: g.edge.from, to: g.edge.to,
                 fromPort: g.edge.fromPort, toPort: g.edge.toPort });
      return;
    }
    if (g.moved) {
      const e = g.edge, nat = bxNaturalMid(e);
      if (e.via && nat && Math.hypot(e.via.x - nat.x, e.via.y - nat.y) < 14) bxClearVia(e);
    }
    bxRender();
    return;
  }
  if (bxWire) {
    const path = bxWire.path, from = bxWire.from, fromPort = bxWire.fromPort;
    bxWire = null;
    if (path && path.parentNode) path.parentNode.removeChild(path);
    const t = (document.elementFromPoint && ev) ? document.elementFromPoint(ev.clientX, ev.clientY) : null;
    const to = t && t.closest ? t.closest(".dport.in") : null;
    const toId = to && to.getAttribute ? to.getAttribute("data-node") : null;
    const toPort = to && to.getAttribute ? Number(to.getAttribute("data-port") || 0) : 0;
    if (toId) bxConnect(from.id, toId, fromPort, toPort);
    return;
  }
  if (bxDrag && bxDrag.kind === "marquee") {
    const rect = bxMarqueeRect;
    bxMarqueeRect = null;
    bxDrag = null;
    bxMarqueeSelect(rect, false);             // the band takes what it touched
    bxRender();
    return;
  }
  if (bxDrag && bxDrag.moved && bxDrag.kind === "move" && (bxDrag.ids || []).length > 1) {
    bxCommit();                               // a whole group moved: one step
  } else if (bxDrag && bxDrag.moved && bxDrag.kind === "move") {
    const into = bxDropTargetAt(ev);          // dropped on a nested box: move it in
    if (into) bxMoveInto(bxDrag.id, into);
    else bxCommit();                          // just a move
  } else if (bxDrag && !bxDrag.moved) {
    if (bxDrag.kind === "move") bxSelectBoxes([bxDrag.id]);   // a click leaves just that box
    else bxSelect(null);               // clicking empty canvas clears it
  }
  if (bxDropIn) {                      // no highlight survives the drag
    const root = bxHost() && bxHost().querySelector ? bxHost().querySelector("svg") : null;
    if (root && root.querySelectorAll)
      for (const g of root.querySelectorAll(".dnode.dropin")) g.classList.remove("dropin");
    bxDropIn = null;
  }
  if (bxGuides.length) {               // …nor any guide line
    bxGuides = [];
    bxRender();
  }
  bxDrag = null;
}

// A blank network is never a void: it opens as one input wired straight into
// one output — the skeleton you build outward from. Only a truly empty
// top-level canvas is seeded; a design you delete by hand stays yours.
function bxSeedBlank() {
  if (BX.up || BX.nodes.length) return false;
  const i = bxAdd("input", 320, 200, {});
  const o = bxAdd("output", 640, 200, {});
  if (!i || !o) return false;
  bxConnect(i.id, o.id);                   // directly: input → output
  bxSettleSizes();
  bxRender();
  return true;
}

// the canvas: add by right-click, move, wire, pan, zoom
{
  const host = $("bxcanvas");
  host.addEventListener("mousedown", bxDown);
  host.addEventListener("mousemove", bxHotMove);
  bxRenderPalette();
  bxUndoLock++;
  bxSeedBlank();                           // a blank NN: input → output
  bxFlowRestore();                         // the backend's last marks, if any
  bxTasksFetch(bxAgentSync);               // a running task keeps streaming
  bxUndoLock--;
  bxUndoStack = [bxSnapshotNow()];         // the skeleton is where undo stops
  bxUndoLast = JSON.stringify(bxUndoStack[0]);
  host.addEventListener("mouseleave", () => bxHotSet(null));
  window.addEventListener("mousemove", bxPalMove);
  window.addEventListener("mouseup", bxPalUp);
  host.addEventListener("dblclick", bxDblClick);
  host.addEventListener("contextmenu", bxMenu);
  host.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    const f = bxWheelFactor(ev.deltaY, ev.deltaMode);
    if (f !== 1) bxZoomAt(ev, f);
  }, { passive: false });
  window.addEventListener("mousemove", bxMove);
  window.addEventListener("mouseup", bxUp);
  window.addEventListener("resize", () => bxRender());
  document.addEventListener("mousedown", (ev) => {
    const m = $("bxmenu");
    if (!m || m.hidden) return;
    const t = ev.target;
    if (t && t.closest && (t.closest("#bxmenu") || t.closest("#bxcanvas"))) return;
    bxMenuClose();
  });
  window.addEventListener("mousemove", (ev) => {
    bxMouse = { x: ev.clientX || 0, y: ev.clientY || 0 };
  });
  document.addEventListener("copy", bxOnCopy);
  document.addEventListener("paste", bxOnPaste);
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { bxMenuClose(); bxSelect(null); return; }
    const t = ev.target;
    const typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" ||
                         t.tagName === "SELECT" || t.isContentEditable);
    if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && !typing) {
      const k = String(ev.key || "").toLowerCase();
      if (k === "z") { ev.preventDefault(); if (ev.shiftKey) bxRedoStep(); else bxUndoStep(); return; }
      if (k === "y") { ev.preventDefault(); bxRedoStep(); return; }
    }
    if (ev.key !== "Delete" && ev.key !== "Backspace") return;
    if (typing) return;                // typing, not deleting
    if (bxDeleteSelection()) ev.preventDefault();
  });
  // the old flow documents have no home here: drop their leftovers
  try {
    localStorage.removeItem("ntdesigns");
    localStorage.removeItem("ntadapters");
    localStorage.removeItem("nttrain_tab");
  } catch (e) {}
  bxRender();                              // draw the empty canvas
  bxtInit();                               // the canvas toolbar
}
