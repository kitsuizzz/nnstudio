server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin OpenAI-compatible API: forward to the gateway container.
    # proxy_pass without a URI -> the original request URI is passed through.
    location /v1 {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE: stream tokens through, never buffer
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # User accounts API, same origin
    location /auth {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gateway liveness, same origin
    location = /healthz {
        proxy_pass http://backend:8000/healthz;
    }

    # The app is built for the /dev/ mount (VITE_BASE_PATH=/dev/), so its asset
    # and API URLs start with /dev/. Behind Caddy that prefix is stripped before
    # it gets here; a direct request (localhost:1234) still carries it, so map it
    # onto the same locations.
    location = /dev {
        rewrite ^ / last;
    }
    location /dev/ {
        rewrite ^/dev/(.*)$ /$1 last;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
