<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>chat.kitsui — Salon</title>
    <!-- No icon of its own: an explicit empty one stops the browser asking the
         domain root for /favicon.ico (another app under the /dev mount). -->
    <link rel="icon" href="data:," />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("aistudio.theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Turnstile (sign-up robot check) loads from here when a site key is built in -->
    <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fragment+Mono:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        background: #fafaf7;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #1a1a19;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
