<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nnstudio — a dedicated app for training a neural network</title>
<style>
  :root {
    --bg: #0a0d13;
    --panel: rgba(255,255,255,.045);
    --panel-brd: rgba(255,255,255,.09);
    --ink: #e8ecf4;
    --ink-dim: #8b95a8;
    --ink-faint: #7e8a9f;
    --accent: #8b7bff;
    --accent2: #2dd4bf;
    --warm: #ffd479;
    --blue: #7fd1ff;
    --err: #ff6b81;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(139,123,255,.16), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(45,212,191,.10), transparent 55%),
      radial-gradient(1000px 700px at 50% 120%, rgba(139,123,255,.08), transparent 60%),
      var(--bg);
    min-height: 100%;
  }
  header {
    max-width: 1180px; margin: 0 auto; padding: 34px 20px 10px;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  .logo { font-weight: 700; font-size: 26px; letter-spacing: -.02em; }
  .logo span { color: var(--accent); }
  .modes { display: flex; gap: 6px; }
  .mode {
    cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-dim);
    border: 1px solid var(--panel-brd); background: rgba(0,0,0,.25);
    padding: 6px 14px; border-radius: 999px; user-select: none; transition: all .15s;
  }
  .mode:hover { color: var(--ink); border-color: rgba(139,123,255,.55); }
  .mode.act { color: var(--ink); border-color: rgba(139,123,255,.7); background: rgba(139,123,255,.16); }
  .sub { color: var(--ink-dim); font-size: 13.5px; }
  main { max-width: 1180px; margin: 0 auto; padding: 14px 20px 60px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-brd);
    border-radius: 18px;
    padding: 20px 22px;
    margin-bottom: 18px;
    backdrop-filter: blur(14px);
    box-shadow: 0 18px 50px -30px rgba(0,0,0,.8);
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1.35fr; gap: 22px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  .gorow { display: flex; align-items: flex-start; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  button.go { flex: 0 0 auto; }
  /* the run-until picker beside the button: type to search, then click a
     result (text + #id) — the run only ever stops at a picked token */
  .untilcombo { position: relative; flex: 1 1 210px; min-width: 185px; }
  .untilcombo input { padding-right: 62px; }
  .untilcombo .uid {
    position: absolute; right: 32px; top: 50%; transform: translateY(-50%);
    font-family: var(--mono); font-size: 11px; color: var(--ink-faint); pointer-events: none;
  }
  .untilcombo .uclear {
    position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    cursor: pointer; color: var(--ink-dim); font-size: 15px; line-height: 1; padding: 2px 3px;
  }
  .untilcombo .uclear:hover { color: var(--ink); }
  #untilresults, #choiceresults {
    position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); z-index: 40;
    display: flex; flex-direction: column; gap: 4px; max-height: 240px; overflow: auto;
    background: #12151d; border: 1px solid var(--panel-brd); border-radius: 12px; padding: 6px;
    box-shadow: 0 18px 50px -18px rgba(0,0,0,.9);
  }
  #untilresults[hidden], #choiceresults[hidden] { display: none; }
  #untilresults .tok, #choiceresults .tok {
    cursor: pointer; text-align: left;
    display: flex; align-items: baseline; gap: 8px;
    border: 1px solid var(--panel-brd); background: rgba(0,0,0,.25);
    border-radius: 10px; padding: 6px 10px;
    color: var(--ink-dim); transition: all .15s;
  }
  #untilresults .tok:hover, #choiceresults .tok:hover { color: var(--ink); border-color: rgba(139,123,255,.55); background: rgba(139,123,255,.12); }
  #untilresults .tok code, #choiceresults .tok code { font-family: var(--mono); font-size: 12px; word-break: break-all; white-space: pre-wrap; }
  #untilresults .tok .panehint, #choiceresults .tok .panehint { margin-left: auto; }
  /* sections, tasks & inference */
  .sec {
    display: flex; align-items: center; gap: 8px; margin: 0 0 10px;
    font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-dim);
  }
  .sec .secnum {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 50%; letter-spacing: 0;
    background: rgba(139,123,255,.18); border: 1px solid rgba(139,123,255,.45);
    color: var(--ink); font-size: 11px;
  }
  button.btn {
    cursor: pointer; border: 1px solid rgba(139,123,255,.5); border-radius: 11px;
    padding: 8px 15px; font: 600 13px system-ui; color: var(--ink);
    background: rgba(139,123,255,.18); transition: all .15s;
  }
  button.btn:hover { background: rgba(139,123,255,.3); border-color: rgba(139,123,255,.75); transform: translateY(-1px); }
  button.btn:disabled { opacity: .5; cursor: wait; transform: none; }
  :focus-visible { outline: 2px solid rgba(139,123,255,.7); outline-offset: 2px; }
  .taskbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    border: 1px solid var(--panel-brd); background: rgba(0,0,0,.22);
    border-radius: 12px; padding: 8px 12px;
  }
  .taskbar input[type="text"] { flex: 1 1 260px; width: auto; padding: 7px 10px; font-size: 13px; }
  .taskbar #taskedtitle { font-family: var(--mono); font-size: 11.5px; }
  .taskchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tasklist { display: flex; flex-direction: column; gap: 5px; max-height: 190px; overflow: auto; }
  .taskrow {
    cursor: pointer; display: flex; align-items: baseline; gap: 8px;
    border: 1px solid var(--panel-brd); background: rgba(0,0,0,.25);
    border-radius: 10px; padding: 7px 10px; color: var(--ink-dim); transition: all .15s;
  }
  .taskchips .taskrow { padding: 6px 11px; border-radius: 999px; }
  .taskrow:hover { color: var(--ink); border-color: rgba(139,123,255,.55); background: rgba(139,123,255,.12); }
  .taskrow.act { color: var(--ink); border-color: rgba(139,123,255,.7); background: rgba(139,123,255,.16); }
  .taskrow code { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); margin-left: auto; word-break: break-all; }
  .taskrow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); flex: 0 0 auto; }
  .taskrow .dot.on { background: #34d399; box-shadow: 0 0 8px #34d399; }
  /* training: the layer map, the adapter spec, the connection preview */
  .archlist { display: flex; flex-direction: column; gap: 4px; max-height: 58vh; overflow: auto; }
  .archrow {
    cursor: pointer; display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--panel-brd); background: rgba(0,0,0,.22);
    border-radius: 10px; padding: 5px 9px; font-size: 12px; color: var(--ink-dim);
    transition: all .15s;
  }
  .archrow:hover { color: var(--ink); border-color: rgba(139,123,255,.5); }
  .archrow.act { color: var(--ink); border-color: rgba(139,123,255,.7); background: rgba(139,123,255,.16); }
  .archrow .idx { font-family: var(--mono); color: var(--ink-faint); min-width: 62px; }
  .archrow.act .idx { color: var(--ink); }
  .archrow .kind { font-size: 10.5px; border: 1px solid var(--panel-brd); border-radius: 999px; padding: 0 7px; }
  .archrow .kind.hybrid { color: var(--warm); border-color: rgba(255,212,121,.4); }
  .archrow .kind.attn { color: var(--blue); border-color: rgba(127,209,255,.4); }
  .archrow .kind.mtp { color: var(--accent2); border-color: rgba(45,212,191,.4); }
  .archrow .bar { flex: 1; height: 6px; border-radius: 999px; background: rgba(0,0,0,.35); overflow: hidden; min-width: 30px; }
  .archrow .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .archrow .sz { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); min-width: 58px; text-align: right; }
  .tensorlist { display: flex; flex-direction: column; gap: 2px; font-family: var(--mono); font-size: 11.5px; }
  .tensorlist .trow { display: flex; gap: 10px; color: var(--ink-dim); }
  .tensorlist .trow .tname { flex: 1; }
  .tensorlist .trow .tshape, .tensorlist .trow .ttype { color: var(--ink-faint); }
  .tensorlist .trow .tsize { color: var(--ink-faint); min-width: 52px; text-align: right; }
  .adgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; margin-top: 12px; }
  .adgrid label { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--ink-faint); }
  .adgrid select, .adgrid input[type="number"] {
    width: 100%; padding: 6px 9px; font-size: 12px; border-radius: 9px;
    background: rgba(0,0,0,.35); color: var(--ink); border: 1px solid var(--panel-brd);
  }
  .pipeline {
    border: 1px solid var(--panel-brd); background: rgba(0,0,0,.25);
    border-radius: 12px; padding: 10px 12px;
    font-family: var(--mono); font-size: 12px; color: var(--ink-dim);
  }
  .pipeline .pl { margin-bottom: 3px; word-break: break-all; }
  .pipeline .pl b { color: var(--ink); }
  .pipeline .pl.warn { color: var(--warm); }
  /* the data-flow diagram */
  .flowsvg {
    border: 1px solid var(--panel-brd); background: rgba(0,0,0,.22);
    border-radius: 12px; padding: 6px; overflow: auto;
  }
  .flowsvg svg { display: block; }
  .frect { fill: rgba(0,0,0,.28); stroke: var(--panel-brd); }
  .fnode[data-target] { cursor: pointer; }
  .fnode[data-target]:hover .frect { stroke: rgba(139,123,255,.7); }
  .fnode.cat-weight .frect { stroke: rgba(127,209,255,.55); }
  .fnode.cat-scale .frect { stroke: rgba(139,123,255,.6); }
  .flabel { fill: var(--ink); font: 600 12px system-ui; }
  .fsub { fill: var(--ink-faint); font: 11px var(--mono); }
  .fedge { stroke: rgba(255,255,255,.28); stroke-width: 1.4; fill: none; }
  .fedge.dashed { stroke-dasharray: 4 3; }
  .fedge.adapter { stroke: rgba(139,123,255,.85); stroke-dasharray: 5 3; }
  .fedge.residual { stroke: rgba(45,212,191,.75); stroke-width: 1.6; }
  .fedge.replaced { stroke: rgba(255,255,255,.12); stroke-dasharray: 2 3; }
  .freslabel { fill: rgba(45,212,191,.9); font: 11px var(--mono); }
  .fadd { fill: rgba(10,14,20,.95); stroke: rgba(45,212,191,.8); stroke-dasharray: 3 2; stroke-width: 1.4; }
  .opbox.implied { stroke-dasharray: 4 3; }
  /* parameter categories — the stroke colour says what a box holds */
  .opbox.cat-weight { stroke: rgba(127,209,255,.55); }
  .opbox.cat-scale { stroke: rgba(139,123,255,.6); }
  .opbox.cat-bias { stroke: rgba(255,212,121,.65); }
  .opbox.cat-param { stroke: rgba(45,212,191,.55); }
  .opbox.cat-act { stroke: rgba(240,166,255,.7); stroke-dasharray: 4 3; }
  .opbox.cat-mixed { stroke: rgba(127,209,255,.45); }
  .catbadge { fill: rgba(10,14,20,.9); }
  .catpill { font: 600 9.5px var(--mono); }
  .catpill.weight { fill: #7fd1ff; }
  .catpill.scale { fill: #8b7bff; }
  .catpill.bias { fill: #ffd479; }
  .catpill.param { fill: #2dd4bf; }
  .catpill.act { fill: #f0a6ff; }
  .catpill.mixed { fill: var(--ink-faint); }
  .lgW { color: #7fd1ff; }
  .lgw { color: #8b7bff; }
  .lgb { color: #ffd479; }
  .lgp { color: #2dd4bf; }
  .lga { color: #f0a6ff; }
  .lgx { color: rgba(45,212,191,.9); }
  /* Step 1: the training UI is one canvas with three boxes (input · layer ·
     output). Every box is drawn by this one card renderer. */
  /* the canvas does not grow with the palette: the row is a fixed height and
     the palette scrolls inside it instead */
  .bxrow { display: flex; gap: 10px; align-items: stretch;
           height: max(420px, calc(100vh - 300px)); min-height: 0; }
  .bxpal { flex: 0 0 200px; display: flex; flex-direction: column; gap: 8px;
           border: 1px solid var(--panel-brd); border-radius: 12px;
           background: rgba(0,0,0,.18); padding: 10px;
           overflow-y: auto; overflow-x: hidden; min-height: 0; }
  .bxvram { margin-top: auto; background: rgba(0,0,0,.28); border: 1px solid var(--panel-brd);
            border-radius: 10px; padding: 8px 9px; display: flex; flex-direction: column; gap: 3px; }
  .bxvram .vhead { display: flex; align-items: center; justify-content: space-between;
                   color: var(--ink-dim); font-size: 11.5px; margin-bottom: 2px; }
  .bxvram .vrow { font: 11px/1.45 var(--mono); color: var(--ink); }
  .bxvram .vrow.warn { color: #f8b4b4; }
  .bxvram .vrow.w { color: #b3a8ff; }
  .bxvram .vrow.frz { color: #7dd3fc; }
  .bxvram .vrow.kv { color: #2dd4bf; }
  .bxvram .vrow.tr { color: #ffd479; }
  .bxvram .vrow.tot { color: #ffffff; font-weight: 700; }
  .bxvram .vrow.sub { color: var(--ink-faint); font-size: 10px; line-height: 1.3; }
  .bxvram .vrow.note { color: var(--ink-dim); }
  .bxvram .vbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden;
                  margin: 1px 0 4px; background: rgba(255,255,255,.07); }
  .bxvram .vbar span { display: block; height: 100%; }
  .bxvram .vbar .w { background: #8b7bff; }
  .bxvram .vbar .kv { background: #2dd4bf; }
  .bxvram .vbar .tr { background: #ffd479; }
  .bxpalitem { cursor: grab; border-radius: 10px; }
  .bxpalitem:hover { background: rgba(255,255,255,.05); }
  .bxpalcard { display: block; }
  .bxghost { position: fixed; z-index: 30; width: 176px; opacity: .9; pointer-events: none; }
  .bxghost.over { outline: 1px dashed rgba(139,123,255,.85); outline-offset: 4px; border-radius: 10px; }
  .bxwrap { position: relative; flex: 1 1 auto; min-height: 0; height: 100%;
            border: 1px solid var(--panel-brd); border-radius: 12px; overflow: hidden;
            background: rgba(0,0,0,.18); }
  .bxwrap .flowsvg { position: absolute; inset: 0; }
  .drect { fill: rgba(18,22,30,.96); stroke: rgba(139,123,255,.5); }
  .dnode:hover .drect { stroke: rgba(139,123,255,.85); }
  /* a fill on the base class, so no kind of box can ever fall back to black */
  .dtype { font: 600 10px var(--mono); fill: var(--ink-dim); }
  .dtype.input, .dtype.output { fill: var(--ink-dim); }
  .dtype.layer { fill: #7fd1ff; }
  .dtype.act { fill: #f0a6ff; }
  .dtype.op { fill: #ffd479; }
  .dtype.custom { fill: #2dd4bf; }
  .dlabel { fill: var(--ink); font: 11.5px var(--mono); }
  .dshape { fill: #2dd4bf; font: 600 10px var(--mono); text-anchor: end; }
  .dshape.lower { text-anchor: start; }
  .dshape.fn { fill: #f0a6ff; }
  .dshape.opfn { fill: #ffd479; }
  .bxcrumbs { position: absolute; left: 10px; top: 10px; z-index: 6; display: flex;
              align-items: center; gap: 8px; background: rgba(8,10,15,.95);
              border: 1px solid var(--panel-brd); border-radius: 10px; padding: 5px 9px; }
  .bxsel { background: rgba(10,14,20,.9); color: var(--ink); border: 1px solid var(--panel-brd);
           border-radius: 7px; padding: 3px 5px; font-size: 11.5px; }
  .bxsel option { background: #12161e; color: var(--ink); }
  .dshape.unset { fill: var(--ink-faint); }
  .dport { fill: rgba(10,14,20,.95); stroke: rgba(139,123,255,.8); cursor: crosshair; }
  .dport.vis { pointer-events: none; }
  .dport.hit { fill: transparent; stroke: none; pointer-events: all; cursor: crosshair; }
  .dport.hit:hover { fill: rgba(139,123,255,.28); }
  .drail { fill: transparent; pointer-events: all; cursor: crosshair; }
  .drail:hover { fill: rgba(139,123,255,.16); }
  .dedge { fill: none; stroke: rgba(139,123,255,.75); stroke-width: 1.6; }
  .dedge.live { stroke: #ffd479; stroke-dasharray: 4 3; }
  .dedge.unknown { stroke: #8a94a6; }
  .dedge.hot { stroke: #ffd479; stroke-width: 2.4; }
  .dnode.sel .drect { stroke: rgba(139,123,255,1); stroke-width: 2; }
  .dnode.err .drect { stroke: #f87171; stroke-dasharray: 5 4; }
  .dnode.dropin .drect { stroke: #2dd4bf; stroke-dasharray: 4 3; }
  .bxguide { stroke: #ffd479; stroke-width: 1; stroke-dasharray: 5 4; opacity: .85;
             pointer-events: none; }
  .bxmarquee { fill: rgba(139,123,255,.10); stroke: rgba(139,123,255,.85);
               stroke-dasharray: 5 4; pointer-events: none; }
  .dnode.dropin .drail { stroke: rgba(45,212,191,.8); }
  .dnode.err .drail { stroke: rgba(248,113,113,.75); }
  .dnode.off { opacity: .42; }
  .dnode.off .drect { stroke-dasharray: 5 4; }
  .dfroz { stroke: #7dd3fc; stroke-width: 1.5; }
  .dnode.warn .drect { stroke: #fbbf24; stroke-dasharray: 5 4; }
  .dnode.warn .drail { stroke: rgba(251,191,36,.75); }
  .dwarn2 { fill: #fbbf24; font: 700 12px var(--mono); text-anchor: end; }
  .dport.doff { stroke: rgba(138,148,166,.6); stroke-dasharray: 2 2; }
  .dport.dstarved { stroke: #fbbf24; }
  .dwarn { fill: #f87171; font: 700 12px var(--mono); text-anchor: end; }
  .dedge.sel { stroke: #2dd4bf; stroke-width: 2.4; }
  .dedge.bad { stroke: #f87171; stroke-dasharray: 5 4; }
  .dedge.off { stroke: rgba(138,148,166,.55); stroke-dasharray: 1 5; }

  .dedge-hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
  .dedge-hit:hover { stroke: rgba(139,123,255,.16); }
  .bxdel circle { fill: rgba(12,14,20,.96); stroke: #ff8b8b; }
  .bxdel text { fill: #ff8b8b; font: 600 12px var(--mono); text-anchor: middle; }
  .bxdel { cursor: pointer; }
  .bxmenu { position: absolute; z-index: 8; min-width: 168px; padding: 4px;
            background: rgba(10,12,18,.98); border: 1px solid var(--panel-brd);
            border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,.5); }
  .bxmenu[hidden] { display: none; }
  .bxmenu .mi { display: block; padding: 5px 9px; border-radius: 7px; cursor: pointer;
                font: 12px var(--ink); font-family: inherit; color: var(--ink); }
  .bxmenu .mi:hover { background: rgba(255,255,255,.07); }
  .bxmenu .bf { display: flex; flex-direction: column; gap: 6px; padding: 6px; }
  .bxmenu .bf label { display: flex; align-items: center; justify-content: space-between;
                      gap: 8px; font-size: 11.5px; color: var(--ink-dim); }
  .bxmenu .bf input { width: 92px; }
  .bxmenu .bf .row { display: flex; gap: 6px; justify-content: flex-end; }
  .bxmenu .bf textarea.bxjson { width: 340px; max-width: 48vw; height: 168px; max-height: 42vh; resize: vertical;
                                background: rgba(10,14,20,.9); color: var(--ink);
                                border: 1px solid var(--panel-brd); border-radius: 7px;
                                padding: 6px 8px; font: 11px/1.5 var(--mono);
                                white-space: pre; overflow: auto; }
  .bxmenu .bf textarea.bxjson:focus { outline: none; border-color: rgba(139,123,255,.55); }
  .bxmenu .bf textarea.bxjson.bad { border-color: #f87171; box-shadow: 0 0 0 1px rgba(248,113,113,.55); }
  .bxmenu .bf .warnbx { color: #f8b4b4; font-size: 11px; line-height: 1.45; padding: 6px 8px;
                        border: 1px solid rgba(248,113,113,.45); border-radius: 7px;
                        background: rgba(248,113,113,.08); }
  /* the assistant drawer */
  .asstoggle {
    cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--ink-dim);
    border: 1px solid var(--panel-brd); background: rgba(0,0,0,.25);
    padding: 5px 12px; border-radius: 999px; user-select: none; margin-left: 8px;
  }
  .asstoggle:hover { color: var(--ink); border-color: rgba(139,123,255,.6); }
  .asstoggle.act { color: var(--ink); border-color: rgba(139,123,255,.8); background: rgba(139,123,255,.16); }
  .asstoggle.busy { border-color: rgba(45,212,191,.85); color: #2dd4bf; }
  .assistant {
    position: fixed; top: 0; right: 0; bottom: 0; width: 440px; max-width: 96vw; z-index: 80;
    background: #0d1017; border-left: 1px solid var(--panel-brd);
    display: flex; flex-direction: column; box-shadow: -24px 0 60px -30px rgba(0,0,0,.95);
  }
  .assistant[hidden] { display: none; }
  .ashead { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
            border-bottom: 1px solid var(--panel-brd); }
  .ashead .grow { flex: 1; }
  #asbrain { max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .aslog { flex: 1; overflow: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .asmsg { max-width: 94%; border-radius: 12px; padding: 8px 11px; font-size: 13.5px;
           white-space: pre-wrap; overflow-wrap: anywhere; }
  .asmsg.user { align-self: flex-end; background: rgba(139,123,255,.16);
                border: 1px solid rgba(139,123,255,.35); }

/* nnstudio: the canvas is the whole app — no tabs, no panels, and the page

body { display: flex; flex-direction: column; }

.bxrow { flex: 1 1 auto; min-height: 0; height: auto; }

              padding: 10px 12px; height: 236px; overflow: hidden; }

#runconsole h4 { margin: 0 0 2px; font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase;
                 color: var(--ink-faint); font-weight: 700; }

                       color: var(--ink-dim); white-space: nowrap; }
#runconsole input, #runconsole select, #runconsole textarea {
  background: rgba(0,0,0,.3); color: var(--ink); border: 1px solid var(--panel-brd);
  border-radius: 6px; padding: 3px 6px; font: 12px var(--mono); min-width: 0; }
#runconsole input[type="text"] { flex: 1 1 60px; width: 60px; }
#runconsole textarea { width: 100%; box-sizing: border-box; min-height: 56px; resize: vertical; }
#runconsole .rrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

<body>

<header>
  <div class="logo">nn<span>·</span>studio</div>
  <div class="sub">compose the network on the canvas, wire it, price it, then train</div>
</header>

<main>
  <section id="view-training" class="view">

      <div class="bxwrap" id="bxwrap">

<section id="runbar">

        <label class="rf">temp <input id="rbTemp" type="number" step="0.05" value="0.8" style="width:52px"></label>

      </div>
    </div>

        <label class="rf">out <select id="rbOut"></select></label>

        <label class="rf">seed <input id="rbSeed" type="number" value="1" style="width:46px"></label>

        <label class="rf">max $ <input id="rbCapUsd" type="number" value="10" style="width:46px"></label>

    const t = (document.elementFromPoint && ev) ? document.elementFromPoint(ev.clientX, ev.clientY) : null;
    const to = t && t.closest ? t.closest(".dport.in") : null;
    const toId = to && to.getAttribute ? to.getAttribute("data-node") : null;
    const toPort = to && to.getAttribute ? Number(to.getAttribute("data-port") || 0) : 0;

function bxrRun() {
  if (typeof fetch !== "function") return;

    bxrConsole(true);
    bxrMsg("rbRunMsg", "come back out to the top level to run", true);
    return;
  }
  const canvas = bxExportCanvas();
  if (!canvas) return;
  const feeds = {};
  for (const n of (BXR.ins || [])) {
    const raw = BXR.inputs[n.id] != null ? BXR.inputs[n.id] : "0";
    const parts = String(raw).replace(/,/g, " ").split(/\s+/).filter(Boolean).map(Number);
    if (!parts.length || parts.some(isNaN)) {
      bxrMsg("rbRunMsg", "input \u201c" + (n.name || n.id) + "\u201d needs numbers", true);
      return;
    }
    feeds[n.id] = parts;

  const gen = Math.max(0, Math.min(256, Number(($("rbGen") || {}).value || 0)));
  bxrConsole(true);
  bxrMsg("rbRunMsg", "running\u2026", false);
  fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ canvas, feeds, generate: gen,
      temperature: Number(($("rbTemp") || {}).value || 0.8),
      input: gen ? bxrInPick() : null, output: bxrOutPick(), seed: 1 }) })
    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(res => {

      BXR.vals = res.d.values || {};
      BXR.sig = bxrStructSig();
      bxRender();
      bxrRenderValues();
      let msg = res.d.ms + " ms \u00b7 " + Object.keys(BXR.vals).length + " boxes";
      if (res.d.generated && res.d.generated.length) {
        const text = bxrDecode(res.d.generated);
        bxrSample(text);
        msg += " \u00b7 generated \u2192 " + JSON.stringify(text.slice(0, 40));
      }
      bxrMsg("rbRunMsg", msg, false, true);
      bxrMsg("rbOutMsg", msg, false, true);

    .catch(e => bxrMsg("rbRunMsg", String((e && e.message) || e), true));

    bxrAsIs();
    bxrChart(BXR.job);
    if (pane === "train" && $("rbData") && $("rbData").focus) $("rbData").focus();
  }
  if (was !== BXR.console) bxRender();
}
function bxrStatus(job) {
  const el = $("rbStatus");
  if (!el) return;
  if (!job) { el.textContent = ""; return; }
  const where = job.where === "modal"
    ? "modal" + (job.gpu ? " \u00b7 " + job.gpu : "") : "this machine";
  if (["running", "queued", "preparing"].indexOf(job.state) >= 0) {
    const parts = ["step " + (job.step || 0) + "/" + (job.steps || 0)];
    if (job.loss != null) parts.push("loss " + Number(job.loss).toFixed(3));
    if (job.eval != null) parts.push("eval " + Number(job.eval).toFixed(3));
    if (job.tps) parts.push(Math.round(job.tps).toLocaleString() + " tok/s");
    if (job.cost_usd != null && job.where === "modal") parts.push("~$" + job.cost_usd);
    parts.push(where);
    el.textContent = parts.join(" \u00b7 ");
  } else if (job.state === "error") {
    el.textContent = "error \u00b7 " + (job.error || "?");
  } else {
    el.textContent = [job.state + " \u00b7 step " + (job.step || 0),
      job.eval != null ? "eval " + Number(job.eval).toFixed(3) : null, where]
      .filter(Boolean).join(" \u00b7 ");
  }
}
function bxrJobState(job) {
  const stop = $("rbStop"), runBtn = $("rbRun"), mode = $("rbMode");
  const live = job && ["running", "queued", "preparing"].indexOf(job.state) >= 0;
  if (stop) stop.hidden = !live;
  if (runBtn) runBtn.hidden = !!live;
  if (mode) mode.textContent = live ? "training" : "inference";
  bxrStatus(job);
  if (!job) return;
  bxrChart(job);
  if (job.samples && job.samples.length)
    bxrSample(job.samples[job.samples.length - 1].text);
  if (job.state === "error") bxrMsg("rbTrainMsg", job.error || "training failed", true);
  else if (live) bxrMsg("rbTrainMsg", "training\u2026", false);
  else {
    const ck = job.checkpoint
      ? (job.checkpoint + (job.where === "modal" ? " (pulled home)" : "")) : null;
    bxrMsg("rbTrainMsg", [job.state,
      job.cost_usd != null && job.where === "modal" ? "~$" + job.cost_usd : null, ck]
      .filter(Boolean).join(" \u00b7 "), job.state === "error", job.state === "done");
  }
}
function bxrChart(job) {
  const wrap = $("rbChartWrap");
  if (!wrap) return;
  wrap.innerHTML = "";
  const s = svg("svg", { viewBox: "0 0 100 34", preserveAspectRatio: "none", class: "rchart" });
  s.appendChild(svg("line", { x1: 0, y1: 33, x2: 100, y2: 33, class: "rax" }));
  const pts = (job && job.losses) || [];
  if (pts.length > 1) {
    const evals = (job && job.evals) || [];
    const all = pts.concat(evals.map(e => e.loss));
    let lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    if (hi - lo < 1e-9) hi = lo + 1;
    const Y = v => 31 - (v - lo) / (hi - lo) * 28;
    s.appendChild(svg("polyline", {
      points: pts.map((v, i) => (i / (pts.length - 1) * 100).toFixed(2) + "," + Y(v).toFixed(2)).join(" "),
      class: "rloss" }));
    const steps = job.steps || pts.length;
    const epts = evals.map(e => ((e.step / steps) * 100).toFixed(2) + "," + Y(e.loss).toFixed(2)).join(" ");
    if (epts) s.appendChild(svg("polyline", { points: epts, class: "rloss eval" }));
  }
  wrap.appendChild(s);
}
function bxrStart() {
  if (typeof fetch !== "function") return;
  if (bxCurrentPath().length) {
    bxrMsg("rbTrainMsg", "come back out to the top level to train", true);
    return;
  }
  const data = ($("rbData") || {}).value || "";
  bxrVocab(true);
  if (String(data).length < 16) {
    bxrMsg("rbTrainMsg", "paste at least a few lines to train on", true);
    return;
  }
  const canvas = bxExportCanvas();
  if (!canvas) return;
  const where = ($("rbWhere") || {}).value || "local";
  const modal = (BXR.where && BXR.where.modal) || {};
  if (where.indexOf("modal") === 0 && !(modal.installed && modal.token)) {
    bxrMsg("rbTrainMsg", "modal is not set up \u2014 run  .venv/bin/modal token new  and reload", true);
    return;
  }
  const config = {
    input: bxrInPick(), output: bxrOutPick(),
    ctx: Number(($("rbCtx") || {}).value || 32),
    batch: Number(($("rbBatch") || {}).value || 16),
    steps: Number(($("rbSteps") || {}).value || 400),
    lr: Number(($("rbLr") || {}).value || 0.0003),
    optimizer: ($("rbOpt") || {}).value || "adamw",
    seed: Number(($("rbSeed") || {}).value || 1),
    max_minutes: Number(($("rbCapMin") || {}).value || 0),
    max_usd: Number(($("rbCapUsd") || {}).value || 0),
    eval_every: 50, sample_every: 100, sample_len: 60, temperature: 0.8,
  };
  if (where.indexOf("modal:") === 0 && where !== "modal:auto") config.gpu = where.slice(6);
  bxrMsg("rbTrainMsg", "starting\u2026", false);
  fetch("/api/train", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ canvas, text: data, config,
      where: where.indexOf("modal") === 0 ? "modal" : "local" }) })
    .then(r => r.json().then(d => ({ ok: r.ok, d })))
    .then(res => {
      if (!res.ok || !res.d.ok) throw new Error(res.d.error || "could not start");
      BXR.job = res.d.job;
      bxrJobState(res.d.job);
      bxrPollStart();
      bxrMsg("rbTrainMsg", "training\u2026", false);
    })
    .catch(e => bxrMsg("rbTrainMsg", String((e && e.message) || e), true));
}
function bxrStop() {
  if (!BXR.job || typeof fetch !== "function") return;
  fetch("/api/jobs/" + BXR.job.id + "/stop", { method: "POST" })
    .then(r => r.json()).catch(() => {});
  bxrMsg("rbTrainMsg", "stopping\u2026 the checkpoint is saved first", false);
}
function bxrPollStart() {
  if (BXR.poll) clearInterval(BXR.poll);
  BXR.poll = setInterval(bxrPoll, 800);
  bxrPoll();
}
function bxrPoll() {
  const id = BXR.job && BXR.job.id;
  if (!id || typeof fetch !== "function") return;
  fetch("/api/jobs/" + id, { cache: "no-store" })
    .then(r => (r.ok ? r.json() : null))
    .then(d => {
      if (!d || !d.job) return;
      BXR.job = d.job;
      bxrJobState(d.job);
      if (["done", "stopped", "error", "capped"].indexOf(d.job.state) >= 0) {
        if (BXR.poll) clearInterval(BXR.poll);
        BXR.poll = null;
        bxrPreflight();
      }
    })
    .catch(() => {});
}
function bxrAsIs() {
  const wrap = $("rbAsIs");
  if (!wrap) return;
  const box = BX.nodes.find(n => n.kind === "custom" && (n.file || n.gguf));
  if (!box) { wrap.hidden = true; return; }
  wrap.hidden = false;
  const sel = $("rbAsisModel");
  if (sel && !(sel.children && sel.children.length) && typeof fetch === "function") {
    fetch("/api/models").then(r => r.json()).then(d => {
      sel.innerHTML = "";
      for (const g of (d.models || []))
        sel.appendChild(mk("option", { value: g.path, text: g.name }));
      if (box.file) {
        const base = String(box.file).split("/").pop();
        for (const o of (sel.children || []))
          if (o.text === base || o.value === box.file) sel.value = o.value;
      }
    }).catch(() => {});
  }
  const go = $("rbAsisGo");
  if (go && !go._wired) {
    go._wired = true;
    go.addEventListener("click", () => {
      const model = ($("rbAsisModel") || {}).value;
      const prompt = ($("rbAsisPrompt") || {}).value || "";
      const n = Number(($("rbAsisN") || {}).value || 64);
      if (!model) return;
      bxrConsole(true);
      bxrMsg("rbRunMsg", "running " + String(model).split("/").pop() + " as-is\u2026", false);
      fetch("/api/gguf/run", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model, prompt, n }) })
        .then(r => r.json().then(d => ({ ok: r.ok, d })))
        .then(res => {
          if (!res.ok || !res.d.ok) throw new Error(res.d.error || "llama.cpp failed");
          bxrSample(res.d.text);
          bxrMsg("rbRunMsg", res.d.ms + " ms \u00b7 " + res.d.model + " (as-is)", false, true);
          bxrMsg("rbOutMsg", res.d.ms + " ms \u00b7 " + res.d.model + " (as-is)", false, true);
        })
        .catch(e => bxrMsg("rbRunMsg", String((e && e.message) || e), true));
    });
  }
}
function bxrInit() {
  const on = (id, ev, fn) => {
    const el = $(id);
    if (el && el.addEventListener) el.addEventListener(ev, fn);
  };
  on("rbRun", "click", bxrRun);
  on("rbTrainOpen", "click", () => bxrConsole(true, "train"));
  on("rbConsoleBtn", "click", () => bxrConsole(!BXR.console));
  on("rbStop", "click", bxrStop);
  on("rbStart", "click", bxrStart);
  on("rbData", "input", () => { bxrVocab(true); bxrPreflight(); });
  on("rbDataFile", "click", () => {
    const f = $("rbDataFileInput");
    if (f && f.click) f.click();
  });
  on("rbDataFileInput", "change", () => {
    const f = $("rbDataFileInput");
    const file = f && f.files && f.files[0];
    if (!file || typeof FileReader !== "function") return;
    const rd = new FileReader();
    rd.onload = () => {
      const ta = $("rbData");
      if (ta) ta.value = String(rd.result || "");
      bxrVocab(true);
      bxrPreflight();
    };
    rd.readAsText(file);
  });
  bxrWhere(true);
  bxrInputs();
  bxrTrainable();
  bxrPreflight();
  bxrChart(null);
  if (typeof fetch === "function") {
    fetch("/api/jobs", { cache: "no-store" })
      .then(r => (r.ok ? r.json() : null))
      .then(d => {
        const live = ((d && d.jobs) || [])
          .find(j => ["running", "queued", "preparing"].indexOf(j.state) >= 0);
        if (live) {
          BXR.job = live;
          bxrJobState(live);
          bxrConsole(true);
          bxrPollStart();
        }
      }).catch(() => {});
  }
}

</script>
